<style>
  /* ============ base (from the Mind-Body guide, kept verbatim where possible) ============ */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: var(--app-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif); background: #0c0a14; color: #e8e6f0; line-height: 1.5; }
  header#app-header { position: sticky; top: 0; background: #0c0a14; border-bottom: 1px solid #221c30; padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 0 14px; z-index: 100; }
  h1 { font-size: 17px; margin: 0 0 8px 0; color: #fff; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  h1 .stamp { font-size: 10px; color: #6a5a8a; font-weight: 400; letter-spacing: 0.3px; }
  .title-row { display: flex; justify-content: space-between; align-items: center; }
  #streak-chip { font-size: 12px; font-weight: 700; color: #ffaa6f; background: #38241a; border-radius: 10px; padding: 4px 10px; }
  #streak-chip.zero { color: #887a9a; background: #1a1626; }
  .tabbar { display: flex; gap: 4px; overflow-x: auto; padding: 2px 0 8px 0; -webkit-overflow-scrolling: touch; }
  .tab { flex-shrink: 0; padding: 8px 12px; background: #1a1626; border: 1px solid #2e2640; border-radius: 10px; color: #aaa; font-size: 12.5px; font-weight: 600; font-family: inherit; cursor: pointer; white-space: nowrap; user-select: none; }
  .tab.active { background: #3a2a4d; color: #fff; border-color: #5a3a7d; }
  /* every control is reachable by keyboard, so every control shows where focus is */
  :focus-visible { outline: 2px solid #b48aff; outline-offset: 2px; }
  main { padding: 10px 14px 90px 14px; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ============ library (guide CSS verbatim) ============ */
  .search-row { display: flex; gap: 6px; }
  #search { flex: 1; padding: 11px 13px; font-size: 16px; background: #1a1626; border: 1px solid #2e2640; border-radius: 10px; color: #fff; outline: none; }
  #search:focus { border-color: #b48aff; }
  #clear-btn { padding: 0 13px; background: #1a1626; border: 1px solid #2e2640; border-radius: 10px; color: #998; font-size: 14px; cursor: pointer; }
  .mega-filter { display: flex; gap: 5px; margin-top: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .mega-pill { flex-shrink: 0; padding: 8px 13px; background: #1a1626; border: 1px solid #2e2640; border-radius: 10px; color: #aaa; font-size: 12px; font-weight: 600; text-align: center; cursor: pointer; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap; }
  /* category colours come from the content pack (megaColors) — the app carries no taxonomy */
  .mega-pill.active { background: var(--mc, #888); border-color: var(--mc, #888); color: #0a0a0a; }
  .mega-pill.active.on-dark { color: #fff; }
  .filter-pills { display: flex; gap: 5px; margin-top: 7px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  .pill { padding: 5px 11px; background: #1a1626; border: 1px solid #2e2640; border-radius: 14px; color: #aaa; font-size: 12px; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
  .pill.active { background: #3a2a4d; color: #fff; border-color: #5a3a7d; }
  .results-count { font-size: 11px; color: #6a5a8a; text-transform: uppercase; letter-spacing: 0.6px; margin: 8px 0; }
  .exercise { background: #14101e; border: 1px solid #221c30; border-radius: 11px; margin-bottom: 8px; overflow: hidden; }
  .exercise-header { padding: 12px 14px; display: grid; grid-template-columns: 44px 1fr auto; grid-template-areas: "icon info chevron" "badges badges badges"; gap: 8px 10px; cursor: pointer; user-select: none; align-items: center; }
  .exercise-header > .ex-icon { grid-area: icon; }
  .exercise-header > .ex-info { grid-area: info; }
  .exercise-header > .chevron { grid-area: chevron; }
  .exercise-header > .badge-row { grid-area: badges; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .exercise-header:active { background: #1a1428; }
  .ex-icon { width: 44px; height: 44px; flex-shrink: 0; background: #1f1830; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 4px; }
  .ex-icon svg { width: 100%; height: 100%; color: #b8a8d8; }
  .ex-info { min-width: 0; overflow: hidden; }
  .ex-title { font-size: 15px; font-weight: 600; color: #fff; line-height: 1.25; word-break: break-word; }
  .ex-sanskrit { font-size: 11px; color: #a090c0; font-style: italic; margin-top: 1px; word-break: break-word; }
  .ex-tag { font-size: 10.5px; color: #888; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }
  .mega-badge { font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
  .mega-badge { background: #1f1830; color: var(--mc, #b48aff);
    background: color-mix(in srgb, var(--mc, #b48aff) 20%, #14101e); }
  .importance { display: inline-flex; align-items: center; gap: 3px; font-size: 9.5px; padding: 2px 6px; border-radius: 3px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; flex-shrink: 0; }
  .importance.t5 { background: #4a1818; color: #ff8080; }
  .importance.t4 { background: #3a2418; color: #ffb060; }
  .importance.t3 { background: #2a2a18; color: #e0d060; }
  .importance.t2 { background: #182a2a; color: #80c0c0; }
  .importance.t1 { background: #1a1a2a; color: #8888a0; }
  .importance-stars { font-size: 11px; letter-spacing: 1px; }
  .difficulty { display: inline-flex; align-items: center; gap: 3px; font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; flex-shrink: 0; }
  .difficulty.beg { background: #18301a; color: #80e090; }
  .difficulty.int { background: #1a2838; color: #80b8ff; }
  .difficulty.adv { background: #38201a; color: #ff9070; }
  .difficulty.exp { background: #3a1832; color: #ff80b8; }
  .esoteric { display: inline-flex; align-items: center; gap: 3px; font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; flex-shrink: 0; }
  .esoteric.e1 { background: #1a2a1a; color: #70d090; }
  .esoteric.e2 { background: #1a2838; color: #80b8ff; }
  .esoteric.e3 { background: #2a2418; color: #d8c060; }
  .esoteric.e4 { background: #2a1838; color: #c898ff; }
  .esoteric.e5 { background: #38182a; color: #ff80d0; }
  .esoteric-glyph { font-size: 9px; letter-spacing: 0.5px; }
  .chevron { color: #5a4a7a; font-size: 12px; transition: transform 0.2s; flex-shrink: 0; }
  .exercise.open > .exercise-header .chevron { transform: rotate(90deg); }
  .exercise-body { display: none; padding: 0 14px 14px 14px; border-top: 1px solid #221c30; }
  .exercise.open > .exercise-body { display: block; }
  .big-icon { width: 100%; height: 100px; background: #1a1626; border-radius: 8px; margin-top: 12px; padding: 10px; display: flex; align-items: center; justify-content: center; }
  .big-icon svg { width: 100%; height: 100%; max-width: 180px; color: #aa90d0; }
  .section { margin-top: 12px; }
  .section-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.7px; color: #b48aff; margin-bottom: 5px; font-weight: 700; }
  .section-title.warn { color: #e2944a; }
  .section-title.tip { color: #5fd068; }
  .section-title.danger { color: #e25555; }
  .section-title.var { color: #c98aff; }
  .section-content { font-size: 13.5px; color: #d0c8e0; }
  .section-content ul { margin: 0; padding-left: 16px; }
  .section-content li { margin-bottom: 3px; }
  .section-content strong { color: #fff; }
  .programming-grid { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
  .programming-grid div:nth-child(odd) { color: #888; text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.5px; align-self: center; }
  .no-results { text-align: center; color: #666; padding: 40px 20px; font-size: 14px; }

  /* recipe grid view */
  .results-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .results-row .results-count { flex: 1; min-width: 90px; }
  .results-row .mini { font-size: 11.5px; padding: 5px 7px; }
  button.pill { font-family: inherit; }
  .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .recipe-card { background: #14101e; border: 1px solid #241c34; border-radius: 12px; padding: 12px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; user-select: none; }
  .recipe-card:active { background: #1a1428; }
  .recipe-card .rc-icon, .sheet-head .rc-icon { color: #b8a8d8; }
  .recipe-card .rc-icon { width: 46px; height: 46px; }
  .rc-icon svg { width: 100%; height: 100%; }
  .recipe-card .rc-title { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.25; }
  .recipe-card .rc-sanskrit { font-size: 10.5px; color: #a090c0; font-style: italic; }
  .rc-meta { font-size: 9.5px; color: #887a9a; text-transform: uppercase; letter-spacing: 0.4px; }
  .rc-badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .recipe-glance { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px 0; align-items: center; }
  .section-content ol { margin: 0; padding-left: 20px; }
  .section-content ol li { margin-bottom: 4px; }
  .quick-cue { background: #1a1626; border-left: 3px solid #b48aff; padding: 9px 11px; border-radius: 5px; margin-top: 8px; font-size: 13px; font-style: italic; color: #c8b8e0; }
  .quick-cue { border-left-color: var(--mc, #b48aff); }
  .variations-wrap { margin-top: 8px; }
  .variation { background: #1a1626; border: 1px solid #2a2238; border-radius: 8px; margin-bottom: 6px; overflow: hidden; }
  .variation-header { padding: 9px 12px; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "title chevron" "badges badges"; gap: 6px 8px; cursor: pointer; user-select: none; align-items: center; }
  .variation-header > .var-title { grid-area: title; }
  .variation-header > .var-chev { grid-area: chevron; }
  .variation-header > .var-badge-row { grid-area: badges; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .variation-header:active { background: #221a32; }
  .var-title { font-size: 13.5px; font-weight: 600; color: #e8d4ff; line-height: 1.3; word-break: break-word; min-width: 0; }
  .var-best { font-size: 9.5px; background: #3a2a4d; color: #d4b3ff; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 700; }
  .var-chev { color: #777; font-size: 11px; transition: transform 0.2s; flex-shrink: 0; }
  .variation.open .var-chev { transform: rotate(90deg); }
  .variation-body { display: none; padding: 0 12px 11px 12px; border-top: 1px solid #2a2238; }
  .variation.open .variation-body { display: block; }
  .var-cue { background: #14101a; border-left: 2px solid #c98aff; padding: 7px 10px; border-radius: 4px; margin-top: 8px; font-size: 12.5px; font-style: italic; color: #c8b8d8; }
  .var-section { margin-top: 9px; }
  .var-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: #c98aff; margin-bottom: 4px; font-weight: 700; }
  .var-section-title.warn { color: #e2944a; }
  .var-section-content { font-size: 12.5px; color: #c8c0d8; }
  .var-section-content ul { margin: 0; padding-left: 15px; }
  .var-section-content li { margin-bottom: 2px; }
  .position-toggle { background: #20182a; border: 1px solid #3a2a4a; color: #c8b8d8; padding: 7px 10px; border-radius: 6px; font-size: 11.5px; cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-weight: 600; }
  .position-toggle:active { background: #2a1f3a; }

  .position-row .pos-label { color: #a090b8; text-transform: uppercase; letter-spacing: 0.4px; font-size: 9.5px; font-weight: 700; align-self: center; }
  .position-row .pos-val { color: #d8d0e0; }
  .position-section-title { font-size: 9.5px; color: #c98aff; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; padding: 5px 2px 2px 2px; border-bottom: 1px solid #3a2a4a; margin-top: 6px; }
  .position-section-title:first-child { margin-top: 0; padding-top: 2px; }

  /* ============ glossary panel (guide CSS verbatim) ============ */
  .gloss-btn { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: 16px; width: 56px; height: 56px; border-radius: 50%; background: #aa6fff; color: #0a0a0a; border: none; font-size: 22px; font-weight: 700; cursor: pointer; z-index: 200; box-shadow: 0 4px 14px rgba(170, 111, 255, 0.4); display: flex; align-items: center; justify-content: center; }
  .gloss-btn:active { transform: scale(0.95); }
  .gloss-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .gloss-backdrop.open { opacity: 1; pointer-events: auto; }
  .gloss-panel { position: fixed; top: 0; right: 0; width: 92%; max-width: 420px; height: 100%; background: #0c0a14; border-left: 1px solid #2e2640; z-index: 310; transform: translateX(100%); transition: transform 0.3s ease-out; display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,0.5); }
  .gloss-panel.open { transform: translateX(0); }
  .gloss-header { padding: calc(12px + env(safe-area-inset-top, 0px)) 14px 8px 14px; border-bottom: 1px solid #221c30; background: #0c0a14; }
  .gloss-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .gloss-title { font-size: 16px; font-weight: 600; color: #fff; margin: 0; }
  .gloss-close { background: #1a1626; border: 1px solid #2e2640; color: #aaa; padding: 6px 12px; border-radius: 8px; font-size: 16px; cursor: pointer; line-height: 1; }

  #gloss-search:focus { border-color: #aa6fff; }
  #gloss-clear { padding: 0 11px; background: #1a1626; border: 1px solid #2e2640; border-radius: 8px; color: #888; cursor: pointer; }
  .gloss-cat-filter { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .gloss-cat-pill { padding: 4px 10px; background: #1a1626; border: 1px solid #2e2640; border-radius: 12px; color: #aaa; font-size: 11px; white-space: nowrap; cursor: pointer; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.3px; }
  .gloss-cat-pill.active { background: #3a2a4d; color: #fff; border-color: #5a3a7d; }
  .gloss-body { flex: 1; overflow-y: auto; padding: 8px 14px calc(30px + env(safe-area-inset-bottom, 0px)) 14px; -webkit-overflow-scrolling: touch; }

  .gloss-letter-header { font-size: 22px; font-weight: 700; color: #aa6fff; padding: 10px 0 4px 0; border-bottom: 1px solid #2a1f3a; margin-top: 12px; letter-spacing: 1px; }

  .gloss-term { font-size: 14.5px; font-weight: 700; color: #fff; }
  .gloss-aka { font-size: 11.5px; color: #888; font-style: italic; }
  .gloss-cat-badge { font-size: 8.5px; font-weight: 700; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.4px; flex-shrink: 0; }
  .gloss-cat-badge.yoga { background: #1a3018; color: #80e090; }
  .gloss-cat-badge.pilates { background: #103030; color: #80e0e0; }
  .gloss-cat-badge.taichi { background: #382f10; color: #ffe480; }

  .gloss-cat-badge.cues { background: #281838; color: #c098ff; }
  .gloss-cat-badge.breath { background: #3a1828; color: #ff80b0; }
  .gloss-cat-badge.mobility { background: #3a2818; color: #ffb868; }
  .gloss-cat-badge.method { background: #2a2a18; color: #e0d060; }

  .gloss-def strong { color: #fff; }
  .gloss-no-results { text-align: center; color: #666; padding: 40px 20px; font-size: 13px; }

  /* ============ app chrome ============ */
  .card { background: #14101e; border: 1px solid #221c30; border-radius: 11px; padding: 12px 14px; margin-bottom: 10px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; background: #1a1626; border: 1px solid #2e2640; border-radius: 10px; color: #d0c8e0; font-size: 13.5px; font-weight: 600; cursor: pointer; user-select: none; }

  /* practice */

  .entry-row .e-min { font-size: 13px; font-weight: 700; color: #b48aff; white-space: nowrap; }
  .entry-x { background: none; border: none; color: #66566e; font-size: 15px; cursor: pointer; padding: 4px 6px; }
  .entry-x:active { color: #ff8080; }
  .session-note { width: 100%; background: #1a1626; border: 1px solid #2e2640; border-radius: 8px; color: #e8e6f0; font-size: 13px; padding: 9px 11px; margin-top: 8px; font-family: inherit; resize: vertical; min-height: 38px; }
  .beat-chip { font-size: 12px; padding: 6px 10px; border-radius: 8px; margin-top: 8px; display: inline-block; }
  .beat-chip.ahead { background: #16281a; color: #80e090; }
  .beat-chip.behind { background: #2a2418; color: #d8c060; }
  .quickstart-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
  .goal-line { display: flex; justify-content: space-between; font-size: 11.5px; color: #887a9a; margin-top: 10px; }
  .goal-line .g { color: #b48aff; font-weight: 700; font-variant-numeric: tabular-nums; }
  .e-min-edit { width: 58px; text-align: right; background: #1a1626; border: 1px solid #2e2640; border-radius: 7px; color: #b48aff; font-size: 13px; font-weight: 700; font-family: inherit; padding: 5px 6px; }
  .ex-hist { display: block; width: 100%; text-align: left; font-size: 11.5px; font-family: inherit; color: #887a9a; background: #1a1626; border: 1px solid #2e2640; border-radius: 7px; padding: 7px 10px; margin-top: 8px; cursor: pointer; }
  .ex-hist strong { color: #b48aff; }
  .ex-hist:active { background: #241c34; }
  /* how the session felt — the mind-body analogue of a load metric */
  .feel-row { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .feel { flex: 1; min-width: 52px; background: #1a1626; border: 1px solid #2e2640; border-radius: 9px; font-size: 20px; padding: 6px 0; cursor: pointer; line-height: 1.2; }
  .feel .fl { display: block; font-size: 9px; letter-spacing: 0.3px; color: #887a9a; text-transform: uppercase; }
  .feel.on { background: #3a2a4d; border-color: #b48aff; }
  .feel.on .fl { color: #d8c8ff; }

  /* picker + sheets + dialogs */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 400; display: flex; align-items: flex-end; justify-content: center; }
  .overlay.center { align-items: center; padding: 20px; }
  .sheet { background: #14101e; border: 1px solid #2e2640; border-radius: 16px 16px 0 0; width: 100%; max-width: 560px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .overlay.center .sheet { border-radius: 14px; max-height: 80vh; padding-bottom: 0; }
  .sheet-head { padding: 12px 14px; border-bottom: 1px solid #221c30; display: flex; align-items: center; gap: 8px; }
  .sheet-head .t { font-size: 15px; font-weight: 700; color: #fff; flex: 1; min-width: 0; }
  .sheet-body { padding: 12px 14px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet-foot { padding: 10px 14px; border-top: 1px solid #221c30; display: flex; gap: 8px; }
  .sheet-foot .btn { flex: 1; }
  .picker-search { width: 100%; padding: 10px 12px; font-size: 15px; background: #1a1626; border: 1px solid #2e2640; border-radius: 9px; color: #fff; outline: none; margin-bottom: 8px; }
  .picker-row { display: flex; align-items: center; gap: 10px; padding: 9px 6px; border-bottom: 1px solid #1c1628; cursor: pointer; border-radius: 6px; }
  .picker-row:active { background: #1a1428; }
  .picker-row .p-icon { width: 34px; height: 34px; flex-shrink: 0; background: #1f1830; border-radius: 7px; display: flex; align-items: center; justify-content: center; padding: 3px; }
  .picker-row .p-icon svg { width: 100%; height: 100%; color: #b8a8d8; }
  .picker-row .p-info { flex: 1; min-width: 0; }
  .picker-row .p-title { font-size: 13.5px; font-weight: 600; color: #fff; }
  .picker-row .p-sub { font-size: 10.5px; color: #887a9a; }
  .minute-stepper { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; }
  .minute-stepper .val { font-size: 34px; font-weight: 700; color: #fff; min-width: 90px; text-align: center; font-variant-numeric: tabular-nums; }
  .minute-stepper .btn { padding: 10px 14px; font-size: 16px; }
  .preset-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 6px; }
  .var-select { width: 100%; background: #1a1626; border: 1px solid #2e2640; border-radius: 9px; color: #e8e6f0; font-size: 13.5px; padding: 10px 11px; margin-top: 4px; }
  .dialog-msg { font-size: 13.5px; color: #d0c8e0; margin: 4px 0 12px 0; white-space: pre-line; }
  .toast { position: fixed; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: #3a2a4d; border: 1px solid #5a3a7d; color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 10px; z-index: 600; opacity: 0; transition: opacity 0.25s; pointer-events: none; max-width: 88%; text-align: center; }
  .toast.show { opacity: 1; }
  /* the toast ignores pointers so it never blocks the UI — its Undo button does not */
  .toast-undo { pointer-events: auto; margin-left: 10px; background: #b48aff; border: none; color: #17101f; font-family: inherit; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 7px; cursor: pointer; }

  /* practice avatar */
  .avatar-box { width: 100%; max-width: 260px; margin: 2px auto 0 auto; position: relative; }
  .avatar-box.preview { max-width: 180px; margin-top: 8px; }
  /* fixed height, cropped viewBox: every pose fills the same box (see avClipBounds) */
  .av-svg { width: 100%; height: 148px; display: block; touch-action: none; cursor: grab; }
  .avatar-box.preview .av-svg { height: 112px; }
  .av-svg:active { cursor: grabbing; }
  .av-bone { stroke: #b48aff; }
  .av-head { fill: #d8c8ff; }
  .av-caption { text-align: center; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #8a7aa8; height: 14px; }

  /* timer overlay */
  .timer-wrap { position: fixed; inset: 0; background: #0c0a14; z-index: 500; display: flex; flex-direction: column; align-items: center; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)) 16px; overflow-y: auto; }
  .timer-name { font-size: 18px; font-weight: 700; color: #fff; text-align: center; }
  .timer-sanskrit { font-size: 12.5px; color: #a090c0; font-style: italic; text-align: center; }
  .timer-step-label { font-size: 11px; color: #b48aff; text-transform: uppercase; letter-spacing: 0.6px; margin-top: 4px; font-weight: 700; }
  .timer-ring-box { position: relative; width: min(62vw, 250px); height: min(62vw, 250px); margin: 14px 0 6px 0; flex-shrink: 0; }
  .timer-ring-box svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer-ring-box { cursor: pointer; }
  .timer-ring-box.blind .t-time { visibility: hidden; }
  .timer-ring-box .t-time { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .timer-ring-box .t-time .t-sub { font-size: 11px; color: #887a9a; font-weight: 400; letter-spacing: 0.5px; text-transform: uppercase; }
  .timer-controls { display: flex; gap: 9px; margin: 10px 0 14px 0; flex-wrap: wrap; justify-content: center; }
  .timer-steps { width: 100%; max-width: 480px; background: #14101e; border: 1px solid #221c30; border-radius: 11px; padding: 12px 14px 12px 14px; }
  .timer-steps .ts-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.7px; color: #b48aff; margin-bottom: 6px; font-weight: 700; }
  .timer-steps ol { margin: 0; padding-left: 20px; font-size: 13.5px; color: #d0c8e0; }
  .timer-steps ol li { margin-bottom: 5px; transition: color 0.2s, opacity 0.2s; }
  .timer-steps ol li.done { opacity: 0.4; }
  .timer-steps ol li.cur { color: #fff; font-weight: 700; }
  .timer-steps ol li.cur::marker { color: #b48aff; }
  .timer-steps .setup-line { font-size: 12px; color: #887a9a; margin-bottom: 8px; font-style: italic; }
  /* the step the timer is walking you through right now */
  .timer-cue { width: 100%; max-width: 480px; background: #14101e; border: 1px solid #2e2640; border-radius: 11px; padding: 9px 13px; margin-top: 9px; font-size: 13.5px; color: #e8e6f0; text-align: center; }
  .timer-cue .n { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.8px; color: #b48aff; font-weight: 700; margin-bottom: 3px; }

  /* history calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head .m { font-size: 14px; font-weight: 700; color: #fff; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { font-size: 9.5px; color: #6a5a8a; text-align: center; text-transform: uppercase; padding: 2px 0; }
  .cal-day { aspect-ratio: 1; border-radius: 8px; background: #14101e; border: 1px solid #1c1628; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #887a9a; cursor: pointer; gap: 2px; }
  .cal-day.out { opacity: 0.25; }
  .cal-day.today { border-color: #b48aff; }
  .cal-day.sel { background: #3a2a4d; color: #fff; }
  .cal-day .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  .cal-day .dot.d1 { background: #5a4a7a; }
  .cal-day .dot.d2 { background: #9a7ad0; }
  .cal-day .dot.d3 { background: #b48aff; box-shadow: 0 0 6px #b48aff88; }
  .sess-card { background: #14101e; border: 1px solid #221c30; border-radius: 11px; margin-bottom: 8px; overflow: hidden; }
  .sess-head { padding: 11px 14px; display: flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
  .sess-head .d { font-size: 13.5px; font-weight: 700; color: #fff; flex: 1; }
  .sess-head .m { font-size: 12.5px; font-weight: 700; color: #b48aff; white-space: nowrap; }
  .sess-body { display: none; padding: 0 14px 12px 14px; border-top: 1px solid #221c30; }
  .sess-card.open .sess-body { display: block; }
  .sess-card.open .chevron { transform: rotate(90deg); }
  .plan-chip { font-size: 9.5px; background: #28183a; color: #d8b8ff; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.4px; }

  /* stats */
  .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .tile { background: #14101e; border: 1px solid #221c30; border-radius: 11px; padding: 11px 12px; }
  .tile .v { font-size: 21px; font-weight: 700; color: #fff; }
  .tile .l { font-size: 10px; color: #887a9a; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .tile.hot .v { color: #ffaa6f; }
  .chart-box { width: 100%; overflow-x: auto; }
  .hbar-row { display: grid; grid-template-columns: 96px 1fr 52px; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 12px; }
  .hbar-row .hl { color: #c8c0d8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-row .hv { color: #887a9a; text-align: right; font-variant-numeric: tabular-nums; }
  .hbar-track { height: 12px; background: #1a1626; border-radius: 6px; overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 6px; background: #b48aff; }
  .mile-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1c1628; }
  .mile-row:last-child { border-bottom: none; }
  .mile-row .icon { font-size: 18px; width: 26px; text-align: center; }
  .mile-row .info { flex: 1; min-width: 0; }
  .mile-row .n { font-size: 13px; font-weight: 600; color: #fff; }
  .mile-row .p { font-size: 11px; color: #887a9a; }
  .mile-row.done .n { color: #80e090; }
  .mile-bar { height: 5px; background: #1a1626; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .mile-bar .f { height: 100%; background: #b48aff; border-radius: 3px; }
  .hbar-row.tap { cursor: pointer; }
  .hbar-row.tap:active { opacity: 0.6; }
  .hbar-row.tap .hl { color: #d8c8ff; }
  /* a year of practice at a glance — one square per day, scrolls sideways on a phone */
  .heat-wrap { overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
  .heat-grid { display: grid; grid-template-rows: repeat(7, 11px); grid-auto-flow: column; grid-auto-columns: 11px; gap: 3px; width: max-content; }
  .heat-months { display: grid; grid-auto-flow: column; grid-auto-columns: 14px; width: max-content; font-size: 9px; color: #6a5a8a; height: 12px; }
  .heat-cell { border-radius: 2px; background: #17121f; }
  .heat-cell.h1 { background: #33265a; }
  .heat-cell.h2 { background: #57409a; }
  .heat-cell.h3 { background: #8461d6; }
  .heat-cell.h4 { background: #b48aff; }
  .heat-cell.today { outline: 1px solid #ffaa6f; outline-offset: 1px; }
  .heat-legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 9.5px; color: #6a5a8a; margin-top: 4px; }
  .heat-legend .heat-cell { width: 11px; height: 11px; }
  /* a localStorage-only app has exactly one safety net: the backup you export */
  .nudge { border-color: #4a3a20; background: #1d1710; }
  .nudge h2 { color: #ffc98a; }

  /* plans */
  .plan-card { background: #14101e; border: 1px solid #221c30; border-radius: 11px; margin-bottom: 8px; padding: 12px 14px; }
  .plan-card .pt { font-size: 14.5px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 7px; }
  .plan-card .pd { font-size: 12px; color: #887a9a; margin: 3px 0 6px 0; }
  .plan-steps-preview { font-size: 12px; color: #c8c0d8; margin-bottom: 8px; }
  .plan-step-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #1c1628; flex-wrap: wrap; }
  .plan-step-row .step-var { flex-basis: 100%; }
  .plan-step-row:last-child { border-bottom: none; }
  .plan-step-row .n { flex: 1; min-width: 0; font-size: 13px; color: #e8e6f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plan-step-row .mins { font-size: 12.5px; font-weight: 700; color: #b48aff; white-space: nowrap; }
  .text-input { width: 100%; background: #1a1626; border: 1px solid #2e2640; border-radius: 9px; color: #fff; font-size: 14px; padding: 10px 12px; font-family: inherit; }
  .field-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.6px; color: #b48aff; margin: 10px 0 4px 0; font-weight: 700; }

  /* settings */
  .set-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #1c1628; }
  .set-row:last-child { border-bottom: none; }
  .set-row .sl { flex: 1; font-size: 13.5px; color: #e8e6f0; }
  .set-row .sl .d { font-size: 11px; color: #887a9a; }
  .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .sl-track { position: absolute; inset: 0; background: #1a1626; border: 1px solid #2e2640; border-radius: 13px; cursor: pointer; transition: background 0.15s; }
  .switch .sl-track::after { content: ''; position: absolute; top: 2px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #887a9a; transition: transform 0.15s, background 0.15s; }
  .switch input:checked + .sl-track { background: #3a2a4d; border-color: #5a3a7d; }
  .switch input:checked + .sl-track::after { transform: translateX(19px); background: #b48aff; }
  input[type=range] { accent-color: #aa6fff; }
  select.mini, input.mini { background: #1a1626; border: 1px solid #2e2640; border-radius: 8px; color: #e8e6f0; font-size: 13px; padding: 7px 9px; }
  .drive-pic { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; background: #1a1626; }
  .about-block { font-size: 12.5px; color: #a89ac0; line-height: 1.6; }
  .about-block strong { color: #e8e6f0; }
</style>
</head>
<body>

<header id="app-header">
  <div class="title-row">
    <h1><svg class="logo" viewBox="0 0 512 512" width="24" height="24" aria-hidden="true"><circle cx="256" cy="256" r="130" fill="none" stroke="#b48aff" stroke-width="34" stroke-linecap="round" stroke-dasharray="700 117" transform="rotate(-55 256 256)"/><polygon points="332,112 396,96 380,160" fill="#b48aff"/><circle cx="256" cy="256" r="26" fill="#b48aff"/></svg> InsightHunter <span class="stamp" id="build-stamp"></span></h1>
    <div id="streak-chip"></div>
  </div>
  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Sections">
    <button type="button" class="tab" id="tab-practice" data-tab="practice" role="tab" aria-controls="panel-practice">🧘 Practice</button>
    <button type="button" class="tab" id="tab-library" data-tab="library" role="tab" aria-controls="panel-library">📚 Library</button>
    <button type="button" class="tab" id="tab-plans" data-tab="plans" role="tab" aria-controls="panel-plans">🗺️ Plans</button>
    <button type="button" class="tab" id="tab-history" data-tab="history" role="tab" aria-controls="panel-history">📅 History</button>
    <button type="button" class="tab" id="tab-stats" data-tab="stats" role="tab" aria-controls="panel-stats">📈 Stats</button>
    <button type="button" class="tab" id="tab-settings" data-tab="settings" role="tab" aria-controls="panel-settings">⚙️ Settings</button>
  </nav>
</header>

<main>
  <section class="panel" id="panel-practice" role="tabpanel" aria-labelledby="tab-practice"></section>

  <section class="panel" id="panel-library" role="tabpanel" aria-labelledby="tab-library">
    <div class="search-row">
      <input type="text" id="search" placeholder="Search the library...  ( / )" autocomplete="off" aria-label="Search the library">
      <button id="clear-btn" aria-label="Clear search">✕</button>
    </div>
    <!-- category pills are rendered from the content pack's vocabulary (renderMegaFilter) -->
    <div class="mega-filter" id="mega-filter"></div>
    <div class="filter-pills" id="filters"></div>
    <div class="results-row">
      <div class="results-count" id="results-count"></div>
      <select class="mini" id="lib-sort" aria-label="Sort the library">
        <option value="default">Guide order</option>
        <option value="az">A → Z</option>
        <option value="importance">Most important</option>
        <option value="esoteric">Most mainstream</option>
        <option value="short">Shortest first</option>
      </select>
      <button class="pill" id="lib-random" title="Show me something new" aria-label="Pick a practice at random">🎲</button>
      <button class="pill" id="view-toggle" onclick="toggleLibView()">▦ Recipe grid</button>
    </div>
    <div id="exercises"></div>
  </section>

  <section class="panel" id="panel-plans" role="tabpanel" aria-labelledby="tab-plans"></section>
  <section class="panel" id="panel-history" role="tabpanel" aria-labelledby="tab-history"></section>
  <section class="panel" id="panel-stats" role="tabpanel" aria-labelledby="tab-stats"></section>
  <section class="panel" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings"></section>
</main>

<button class="gloss-btn" id="gloss-btn" title="Open glossary" aria-label="Open glossary">📖</button>
<div class="gloss-backdrop" id="gloss-backdrop"></div>
<aside class="gloss-panel" id="gloss-panel" aria-label="Glossary">
  <div class="gloss-header">
    <div class="gloss-title-row">
      <h2 class="gloss-title">📖 Mind-Body Glossary</h2>
      <button class="gloss-close" id="gloss-close" aria-label="Close">✕</button>
    </div>
    <div class="gloss-search-row">
      <input type="text" id="gloss-search" placeholder="Search terms, alternate names..." autocomplete="off">
      <button id="gloss-clear">✕</button>
    </div>
    <div class="gloss-cat-filter" id="gloss-cat-filter"></div>
  </div>
  <div class="gloss-body" id="gloss-body"></div>
</aside>

<div id="overlay-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>window.IH_CONTENT = {"icons":{"meditation":"<svg viewBox=\"0 0 100 100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"50\" cy=\"22\" r=\"9\"/><path d=\"M50 32v25\"/><path d=\"M50 40 29 57M50 40l21 17\"/><path d=\"M29 57 50 69l21-12\"/><path d=\"M24 69q26 11 52 0\"/></svg>","seated":"<svg viewBox=\"0 0 100 100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"50\" cy=\"22\" r=\"9\"/><path d=\"M50 32v25\"/><path d=\"M50 40 29 57M50 40l21 17\"/><path d=\"M29 57 50 69l21-12\"/><path d=\"M24 69q26 11 52 0\"/></svg>","breath":"<svg viewBox=\"0 0 100 100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 58q13-26 26 0t26 0 26 0\"/><path d=\"M10 76q13-16 26 0t26 0 26 0\"/></svg>","standing":"<svg viewBox=\"0 0 100 100\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"50\" cy=\"18\" r=\"9\"/><path d=\"M50 28v34M50 62l-11 24M50 62l11 24M36 40h28\"/></svg>"},"megaLabels":{"meditation":"Meditation"},"megaColors":{"meditation":"#b48aff"},"importanceDefaults":{"meditation":4},"esotericDefaults":{"meditation":1},"importanceMap":{"sitting-meditation":5},"esotericMap":{"sitting-meditation":1},"difficultyOverrides":{"breath-awareness":"beg","counted-breath":"beg","body-settling":"beg"},"subFiltersByMega":{},"bodyLabels":{"hips":"Hips","spine":"Spine","shoulders":"Shoulders","hands":"Hands","head":"Head/Neck","gaze":"Eyes","jaw":"Jaw","breath":"Breathing"},"equipLabels":{"seat":"Seat","surface":"Surface","clothing":"Clothing","timer":"Timer"},"positionDefaults":{"sitting-meditation":{"body":{"hips":"A little higher than the knees — sit on the front edge of a cushion or chair","spine":"Upright and stacked, following its natural curves. Tall, not braced","shoulders":"Let them drop. Nothing held","hands":"Resting in the lap or on the thighs, wherever they are forgotten soonest","head":"Balanced over the shoulders, chin very slightly down","gaze":"Eyes closed, or open and soft on a spot a metre or two ahead","jaw":"Unclenched, teeth apart, tongue loose","breath":"Ordinary. You are watching it, not running it"},"equipment":{"seat":"Chair, cushion, folded blanket or bench — whatever lets you sit upright without strain","surface":"Stable and level; feet flat on the floor if you're on a chair","clothing":"Loose enough at the waist to breathe freely","timer":"Use the app's timer so you never have to check the clock"}}},"exercises":[{"id":"sitting-meditation","title":"Sitting Meditation","tag":"Meditation • Foundation","mega":"meditation","sub":"seated","icon":"meditation","keywords":"sitting meditation mindfulness breath attention focus beginner basic starter","quickCue":"Sit still, let the breath stay ordinary, and begin again every time you notice you have drifted. The returning is the practice.","general":{"setup":["Pick a seat — chair, cushion or bench — that lets your hips sit a little above your knees","Choose somewhere you won't be interrupted for the length of the sit","Silence your phone; the timer will tell you when you're done","Decide the length before you start, and don't renegotiate it once you're sitting"],"movement":["Sit down and let the body arrive for a few breaths before doing anything","Set the posture: upright but not stiff, hands resting, shoulders dropped","Close the eyes, or lower them to a soft point a metre or two ahead","Take three slower breaths to mark the beginning","Let the breath go back to its own rhythm — you are watching it, not steering it","Put your attention on one place where the breath is obvious: the nostrils, the chest, or the belly","Stay with one breath at a time. Not the last one, not the next one","Sooner or later you'll notice you've been thinking about something else. That noticing is the practice working","Note briefly where the mind went, without grading it, and bring attention back to the same place","Repeat that returning for the rest of the time, as many times as it takes — ten or a hundred, it makes no difference","When the bell sounds, take one deliberate breath before you move, then open your eyes slowly"],"mistakes":["Trying to stop thinking — noticing thoughts is the practice, not a failure at it","Forcing the breath into a pattern. Let it be as boring as it wants","Sitting rigid. Upright, not braced — tension in the shoulders and jaw is the usual giveaway","Grading the sit good or bad afterwards. The only thing that counts is that you sat","Starting at forty-five minutes. Five or ten daily beats an hour once a fortnight","Checking how long is left. That's what the timer is for"]},"variations":[{"id":"breath-awareness","title":"Breath Awareness","best":"Start Here","cue":"One place, one breath, begin again. The whole instruction fits in a sentence.","setup":["Settle into the posture and take three slower breaths","Pick your spot — nostrils, chest or belly — and keep it for the whole sit"],"movement":["Rest attention on the chosen spot","Feel the beginning, middle and end of one in-breath","Feel the small pause, then the out-breath, all the way to its end","Do that again with the next breath","When you find you've drifted, note it and come back to the same spot","Keep going until the bell"],"mistakes":["Moving the spot around mid-sit, looking for a better one","Deepening the breath so it's easier to feel — that's a different practice","Adding effort each time you drift. Come back lightly"],"programming":{"Time":"10 min","Frequency":"Daily","Posture":"Seated","Eyes":"Closed or soft"},"tip":"If the breath is hard to feel, rest a hand on the belly for the first minute and follow the hand instead."},{"id":"counted-breath","title":"Counted Breaths","best":"Busy Mind","cue":"Count out-breaths one to ten, then start at one again. Lost count? Start at one again.","setup":["Settle into the posture and take three slower breaths","Decide that the count goes on the out-breath"],"movement":["Breathe in normally, and on the out-breath count 'one' silently","Next out-breath, 'two' — and so on up to ten","At ten, drop back to one and go again","If you notice the count has run past ten, or you can't remember the number, start again at one","Starting again is not a penalty; it's the whole exercise","Continue until the bell"],"mistakes":["Counting so deliberately that the counting becomes louder than the breathing","Treating a lost count as evidence you're bad at this","Speeding the breath up to reach ten"],"programming":{"Time":"10 min","Frequency":"Daily","Posture":"Seated","Count":"1–10, repeating"},"tip":"A busy or sleepy mind holds a count better than it holds bare attention. Use this one on hard days."},{"id":"body-settling","title":"Body Settling","best":"Before You Sit","cue":"Two or three minutes of feeling where the body meets the seat, to arrive before you start.","setup":["Sit down without arranging yourself yet","Let the breath do whatever it is already doing"],"movement":["Feel the contact between your feet and the floor","Feel where your seat meets the chair or cushion, and how the weight sits on it","Feel the hands where they rest, and their temperature","Notice the whole shape of the body sitting there, all at once","Let anything that is obviously held — shoulders, jaw, forehead — go slack","Take one longer out-breath, and go on into the sit"],"mistakes":["Turning it into a search for tension to fix","Spending the whole session here — two or three minutes is the point"],"programming":{"Time":"3 min","Frequency":"Before any sit","Posture":"Seated"},"tip":"Use this as the first step of a longer session rather than a practice on its own."}]}],"seedPlans":[{"id":"seed-first-sit","name":"First Sit","desc":"Five minutes to find out what sitting is actually like.","steps":[{"exId":"sitting-meditation","varId":"body-settling","min":2},{"exId":"sitting-meditation","varId":"breath-awareness","min":3}]},{"id":"seed-daily-ten","name":"Daily Ten","desc":"A ten-minute sit you can repeat every morning.","steps":[{"exId":"sitting-meditation","varId":"body-settling","min":2},{"exId":"sitting-meditation","varId":"breath-awareness","min":8}]},{"id":"seed-hard-day","name":"Hard Day","desc":"For when the mind won't stay put — counting gives it a handrail.","steps":[{"exId":"sitting-meditation","varId":"counted-breath","min":10}]}],"avatarClips":{},"avatarByEx":{"sitting-meditation":"seated"},"avatarDefaultsByMega":{"meditation":"seated"},"glossaryCategories":[{"id":"all","label":"All"},{"id":"method","label":"Method"},{"id":"breath","label":"Breath"},{"id":"mindful","label":"Attention"},{"id":"cues","label":"Posture"}],"glossary":[{"term":"Anchor","cat":"method","def":"The one thing you keep coming back to — usually the feeling of the breath at a chosen spot. Having a single anchor is what makes it possible to notice you've left it."},{"term":"Attention","cat":"mindful","def":"What you are aware of right now. It moves on its own constantly; meditation is not about pinning it down but about noticing where it has gone and returning it."},{"term":"Beginning again","cat":"method","aka":"starting over","def":"Returning attention to the anchor after it has wandered. The single most repeated action in the practice, and the one that actually trains anything."},{"term":"Breath awareness","cat":"breath","def":"Watching the breath without changing it. The distinction matters: as soon as you are lengthening or deepening, you are doing a breathing exercise instead."},{"term":"Contact points","cat":"cues","def":"The places where the body meets the floor, seat or itself. Easy sensations to find, which makes them a reliable way to settle before a sit."},{"term":"Mind-wandering","cat":"mindful","aka":"drifting","def":"Attention leaving the anchor for a thought, plan or memory, usually without you noticing at the time. Expected, frequent, and not a mistake."},{"term":"Noting","cat":"method","def":"Naming what pulled attention away — 'planning', 'sound', 'itch' — briefly and without comment, before returning. Keeps you from getting drawn into the content."},{"term":"Posture","cat":"cues","def":"Upright and stable enough to stay awake, relaxed enough to stay still. Chair, cushion or bench are equally valid; hips slightly above the knees is the usual advice."},{"term":"Session","cat":"method","def":"One continuous sit of a decided length. Deciding the length before you start, and not renegotiating it once you're sitting, is most of the discipline."},{"term":"Settling","cat":"method","def":"The first minutes of a sit, where the body arrives and the obvious tension drops. Skipping it usually means spending the whole session fidgeting."},{"term":"Soft gaze","cat":"cues","def":"Eyes open but unfocused, resting on a spot a metre or two ahead and slightly down. An alternative to closed eyes if you get drowsy."},{"term":"Sitting still","cat":"cues","def":"Not moving for the length of the sit, including small adjustments. Stillness is a decision, not a feeling — the urge to shift usually passes if you watch it instead of obeying it."}]};</script>

/* ==================================================================

/* Content comes from window.IH_CONTENT. Every binding has an empty default, so the app
   runs with a partial pack or with none at all — it owns no practice content of its own. */
const IH_C = (typeof window !== 'undefined' && window.IH_CONTENT) || {};
const icons = IH_C.icons || {};
const importanceMap = IH_C.importanceMap || {};
const importanceDefaults = IH_C.importanceDefaults || {};
const difficultyOverrides = IH_C.difficultyOverrides || {};
const esotericMap = IH_C.esotericMap || {};
const esotericDefaults = IH_C.esotericDefaults || {};
const bodyLabels = IH_C.bodyLabels || {};
const equipLabels = IH_C.equipLabels || {};
const positionDefaults = IH_C.positionDefaults || {};
const exercises = IH_C.exercises || [];
const subFiltersByMega = IH_C.subFiltersByMega || {};
const glossary = IH_C.glossary || [];
const glossaryCategories = IH_C.glossaryCategories || [{ id: 'all', label: 'All' }];
const HAS_CONTENT = exercises.length > 0;

/* Badge and body-position rendering. Pure presentation over whatever the content pack
   supplies: no practice names, no taxonomy, no vocabulary of its own. A pack that rates
   nothing still renders — every lookup has a neutral fallback. */

/* ---------- importance (practice level, 1-5) ---------- */
function getImportance(id, mega) {
  const v = importanceMap[id];
  if (v >= 1 && v <= 5) return v;
  const d = importanceDefaults[mega];
  return d >= 1 && d <= 5 ? d : 3;
}
function importanceBadge(id, mega) {
  const score = getImportance(id, mega);
  const labels = { 5: 'Essential', 4: 'Important', 3: 'Useful', 2: 'Optional', 1: 'Niche' };
  const stars = '★'.repeat(score) + '☆'.repeat(5 - score);
  return `<span class="importance t${score}" title="${labels[score]}"><span class="importance-stars">${stars}</span></span>`;
}

/* ---------- difficulty (variation level) ---------- */
function getDifficulty(varId) {
  const d = difficultyOverrides[varId];
  return d === 'beg' || d === 'int' || d === 'adv' || d === 'exp' ? d : 'int';
}
function difficultyBadge(varId) {
  const diff = getDifficulty(varId);
  const labels = { beg: 'Beginner', int: 'Intermediate', adv: 'Advanced', exp: 'Expert' };
  return `<span class="difficulty ${diff}" title="${labels[diff]}">${labels[diff]}</span>`;
}

/* ---------- how far off the beaten track a practice is (1-5) ----------
   1 = found in any class or app, 5 = deep in a specific tradition. Packs that don't
   care can omit it entirely and everything reads as 1. */
function getEsoteric(id, mega) {
  const v = esotericMap[id];
  if (v >= 1 && v <= 5) return v;
  const d = esotericDefaults[mega];
  return d >= 1 && d <= 5 ? d : 1;
}
function esotericBadge(id, mega) {
  const score = getEsoteric(id, mega);
  const labels = { 1: 'Mainstream', 2: 'Common', 3: 'Specialized', 4: 'Obscure', 5: 'Hermetic' };
  const glyphs = { 1: '◯', 2: '◐', 3: '◉', 4: '❂', 5: '◈' };
  return `<span class="esoteric e${score}" title="${labels[score]}"><span class="esoteric-glyph">${glyphs[score]}</span>${labels[score]}</span>`;
}

/* ---------- body position & props table ----------
   A variation's own position overlays the family's defaults, field by field. */
function getPosition(variation, parentId) {
  const defaults = positionDefaults[parentId] || null;
  if (!variation || !variation.position) return defaults;
  if (!defaults) return variation.position;
  return {
    body: { ...(defaults.body || {}), ...(variation.position.body || {}) },
    equipment: { ...(defaults.equipment || {}), ...(variation.position.equipment || {}) },
  };
}
function renderPosition(uid, position) {
  if (!position) return '';
  const rows = (obj, labels) => Object.entries(obj || {}).map(([k, v]) =>
    `<div class="position-row"><div class="pos-label">${labels[k] || k.charAt(0).toUpperCase() + k.slice(1)}</div><div class="pos-val">${v}</div></div>`);
  const bodyRows = rows(position.body, bodyLabels);
  const equipRows = rows(position.equipment, equipLabels);
  if (!bodyRows.length && !equipRows.length) return '';
  return `<div class="position-wrap" data-pid="${uid}">
    <div class="position-toggle" tabindex="0" role="button" aria-expanded="false" onclick="togglePos('${uid}')"><span>📐 Body Position &amp; Props</span><span class="pos-chev">▶</span></div>
    <div class="position-table">
      ${bodyRows.length ? `<div class="position-section-title">Body</div>${bodyRows.join('')}` : ''}
      ${equipRows.length ? `<div class="position-section-title">Props &amp; Equipment</div>${equipRows.join('')}` : ''}
    </div>
  </div>`;
}
function togglePos(pid) {
  event.stopPropagation();
  setExpanded(document.querySelector(`.position-wrap[data-pid="${pid}"]`), '.position-toggle');
}

</script>

// generic motions the app ships with — no tradition attached
const AV_CLIPS_BUILTIN = {
  still: { breath: 1, period: 8, loop: [{ pose: 'stand', in: 1.2, hold: 7 }] },
  seated: { breath: 1, period: 9, loop: [{ pose: 'crossLegged', in: 1.5, hold: 9 }] },

const AV_REDUCED = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

function avClips() { return Object.assign({}, AV_CLIPS_BUILTIN, IH_C.avatarClips || {}); }

/* which motion a practice performs — the mapping lives in the content pack */
function avClipFor(exId, varId) {
  const all = avClips();
  const byEx = IH_C.avatarByEx || {};
  const name = (varId && byEx[exId + '/' + varId]) || byEx[exId]
    || (IH_C.avatarDefaultsByMega || {})[(exFor(exId) || {}).mega];
  const clip = all[name] || AV_CLIPS_BUILTIN.still;
  return clip.loop && clip.loop.length ? clip : AV_CLIPS_BUILTIN.still;
}

/* pose at time t seconds into a looping clip, blended between keyframes */
function avPoseAt(clip, t) {
  const loop = clip.loop;
  const total = loop.reduce((s, k) => s + (k.in || 0) + (k.hold || 0), 0) || 1;
  if (AV_REDUCED) return AV_POSES[loop[0].pose] || AV_POSES.stand;
  let u = ((t % total) + total) % total;
  for (let i = 0; i < loop.length; i++) {
    const k = loop[i];
    const from = AV_POSES[loop[(i - 1 + loop.length) % loop.length].pose] || AV_POSES.stand;
    const to = AV_POSES[k.pose] || AV_POSES.stand;
    const tin = k.in || 0;
    if (u < tin) {
      const f = tin ? u / tin : 1;
      const e = f * f * (3 - 2 * f); // smoothstep, so poses ease rather than snap
      const out = {};
      for (const j in to) {
        const a = from[j] || to[j];
        out[j] = [a[0] + (to[j][0] - a[0]) * e, a[1] + (to[j][1] - a[1]) * e, a[2] + (to[j][2] - a[2]) * e];
      }
      return out;
    }
    u -= tin + (k.hold || 0);
    if (u < 0) return to;
  }
  return AV_POSES[loop[loop.length - 1].pose] || AV_POSES.stand;
}

/* Frame the camera on the whole clip, not one pose: a seated figure and a standing one
   should each fill the box, and the framing must not jump between keyframes. Uses the
   rotation-invariant radius so turning the figure never crops it. */
function avClipBounds(clip) {
  let r = 0, top = 0;
  for (const k of clip.loop) {
    const pose = AV_POSES[k.pose] || AV_POSES.stand;
    for (const j in pose) {
      const p = pose[j];
      r = Math.max(r, Math.sqrt(p[0] * p[0] + p[2] * p[2]));
      top = Math.max(top, p[1]);
    }
  }
  const s = 0.78, halfW = r * s * 1.25 + 10, h = top * s * 1.15 + 12;
  return { x: 100 - halfW, y: 186 - h, w: halfW * 2, h: h + 12 };
}

function avProject(p, yaw, pitch, s, cx, cy) {
  const cyw = Math.cos(yaw), syw = Math.sin(yaw);
  const x = p[0] * cyw + p[2] * syw;
  const zr = -p[0] * syw + p[2] * cyw;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const y = p[1] * cp - zr * sp;
  const z = p[1] * sp + zr * cp;
  const k = 420 / (420 + z); // perspective divide
  return [cx + x * k * s, cy - y * k * s, z, k];
}

/* AV.mount(el, {exId, varId}) draws and animates until AV.stop() */
const AV = {
  // a 3/4 view from the side: forward motion (folds, planks) has to read as depth
  raf: 0, host: null, els: null, yaw: 1.05, pitch: 0.12, clip: null, t0: 0,

  mount(host, opts) {
    this.stop();
    this.host = host;
    this.clip = opts.clip || avClipFor(opts.exId, opts.varId);
    this.t0 = Date.now();
    const vb = avClipBounds(this.clip);
    // classes, not ids: an avatar can be mounted in the timer and the settings preview at once
    host.innerHTML = `
      <svg class="av-svg" viewBox="${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}" aria-hidden="true">
        <ellipse class="av-shadow" cx="100" cy="182" rx="34" ry="7" fill="#000" opacity="0.35"/>
        ${AV_BONES.map(() => '<line class="av-bone" stroke-linecap="round"/>').join('')}
        <circle class="av-head" r="9"/>
      </svg>
      <div class="av-caption"></div>`;
    this.els = {
      svg: host.querySelector('.av-svg'),
      shadow: host.querySelector('.av-shadow'),
      head: host.querySelector('.av-head'),
      caption: host.querySelector('.av-caption'),
      bones: [...host.querySelectorAll('.av-bone')],
    };
    // drag to orbit
    let dragX = null, yaw0 = 0;
    const down = (e) => { dragX = (e.touches ? e.touches[0] : e).clientX; yaw0 = this.yaw; };
    const move = (e) => {
      if (dragX === null) return;
      const x = (e.touches ? e.touches[0] : e).clientX;
      this.yaw = yaw0 + (x - dragX) * 0.012;
      if (e.cancelable) e.preventDefault();
    };
    const up = () => { dragX = null; };
    this.els.svg.addEventListener('pointerdown', down);
    this.els.svg.addEventListener('pointermove', move);
    this.els.svg.addEventListener('pointerup', up);
    this.els.svg.addEventListener('pointercancel', up);
    this.draw(0);
    if (!AV_REDUCED) this.loop();
    return this;
  },

  loop() {
    const step = () => {
      if (!this.host || !this.host.isConnected) return this.stop();
      this.draw((Date.now() - this.t0) / 1000);
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },

  draw(t) {
    const clip = this.clip;
    const pose = avPoseAt(clip, t);
    // breath: chest and shoulders rise on the inhale, and drive the caption
    const period = clip.period || 8;
    const phase = AV_REDUCED ? 0 : Math.sin((t / period) * Math.PI * 2);
    const amp = (clip.breath === undefined ? 1 : clip.breath) * 2.6;
    const lifted = {};
    for (const j in pose) {
      const rise = (j === 'chest' || j === 'neck' || j === 'head' || j === 'shL' || j === 'shR') ? amp * phase : 0;
      lifted[j] = [pose[j][0], pose[j][1] + rise, pose[j][2] + rise * 0.4];
    }
    const pts = {};
    for (const j in lifted) pts[j] = avProject(lifted[j], this.yaw, this.pitch, 0.78, 100, 186);

    AV_BONES.forEach((b, i) => {
      const a = pts[b[0]], c = pts[b[1]];
      const el = this.els.bones[i];
      if (!a || !c) return;
      el.setAttribute('x1', a[0].toFixed(1)); el.setAttribute('y1', a[1].toFixed(1));
      el.setAttribute('x2', c[0].toFixed(1)); el.setAttribute('y2', c[1].toFixed(1));
      const k = (a[3] + c[3]) / 2;
      el.setAttribute('stroke-width', (b[2] * k).toFixed(2));
      el.setAttribute('opacity', Math.max(0.45, Math.min(1, k)).toFixed(2)); // depth cue
    });
    const h = pts.head;
    this.els.head.setAttribute('cx', h[0].toFixed(1));
    this.els.head.setAttribute('cy', h[1].toFixed(1));
    this.els.head.setAttribute('r', (9 * h[3]).toFixed(1));
    // ground contact: screen y grows downwards, so the lowest point is the largest y
    let low = 0, sumX = 0, n = 0;
    for (const j in pts) { low = Math.max(low, pts[j][1]); sumX += pts[j][0]; n++; }
    this.els.shadow.setAttribute('cy', (low + 2).toFixed(1));
    this.els.shadow.setAttribute('cx', (sumX / n).toFixed(1));
    this.els.shadow.setAttribute('rx', (18 + 16 * Math.abs(Math.sin(this.yaw))).toFixed(1));
    if (this.els.caption) {
      this.els.caption.textContent = AV_REDUCED || clip.breath === 0 ? ''
        : (Math.cos((t / period) * Math.PI * 2) > 0 ? 'Inhale' : 'Exhale');
    }
  },

  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = 0;
    this.host = null;
    this.els = null;
  },
};

    const s = document.createElement('script');

async function fetchDriveProfile(token) {

    if (r.ok) {

    }

function requestDriveToken(clientId, prompt) {
  return new Promise((resolve, reject) => {
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: DRIVE_SCOPE,
      callback: (resp) => {
        if (resp && resp.access_token) {

/* silent: only reuse an existing grant — never open a sign-in popup */
async function driveConnect(opts) {

  if (driveTokenValid()) {
    if (!_driveProfile) await fetchDriveProfile(_driveToken.value);
    return _driveToken.value;
  }
  await loadGis();
  let token;
  try {
    token = await requestDriveToken(clientId, '');          // existing grant, no popup
  } catch (e) {
    if (silent) throw e;                                    // auto/boot: stay quiet

async function driveFind(token) {
  const q = encodeURIComponent("name='" + DRIVE_FILE_NAME + "' and trashed=false");
  const r = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' + q + '&fields=files(id,name,modifiedTime)',
    { headers: { Authorization: 'Bearer ' + token } });

  const j = await r.json();

// ponytail: one multipart request. A practice log is tens of KB, so Drive's 5 MB multipart cap

async function driveUpload(token, text) {

  const meta = existing ? {} : { name: DRIVE_FILE_NAME, parents: ['appDataFolder'] };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
  form.append('file', new Blob([text], { type: 'application/json' }));

    ? 'https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=multipart'
    : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
  const r = await fetch(url, { method: existing ? 'PATCH' : 'POST', headers: { Authorization: 'Bearer ' + token }, body: form });

  if (!r.ok) throw new Error('Drive download failed (' + r.status + ').');
  return await r.text();

function driveErr(e) {
  const m = (e && e.message) || '';
  return /^[\x20-\x7e’]{1,90}$/.test(m) ? m : 'Drive request failed.';

  }
  if (!state.sound.bell) return;
  // soft = the short single tone used to mark a guided step change, not a session boundary
  const partials = soft ? [880] : [528, 792, 1056];
  const peaks = soft ? [0.22] : [0.5, 0.22, 0.08];
  const decay = soft ? 0.7 : 2.4;
  try {
    _actx = _actx || new (window.AudioContext || window.webkitAudioContext)();
    if (_actx.state === 'suspended') _actx.resume();

      partials.forEach((f, j) => {
        const o = _actx.createOscillator(), g = _actx.createGain();
        o.type = 'sine'; o.frequency.value = f;

    b.className = 'toast-undo';
    b.textContent = label || 'Undo';
    b.addEventListener('click', () => { t.classList.remove('show'); clearTimeout(_toastT); undo(); });
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => t.classList.remove('show'), undo ? 8000 : 2200);
}

/* ---------- overlays: focus, Escape, and the phone's back button ----------
   Every sheet goes through showOverlay, so all three behave the same way and a
   sheet can never strand focus behind it. */
let _restoreFocus = null;
let _ovMarker = false;    // our history entry is on top of the stack
let _releaseT = 0;        // deferred history.back() — see closeOverlay
let _popping = false;     // inside popstate — don't navigate back again
let _onClose = null;      // dismiss callback, so a sheet closed by Escape still settles its promise
function showOverlay(html) {
  const root = $('overlay-root');
  if (!root.firstElementChild) {
    _restoreFocus = document.activeElement;
    _onClose = null;
    clearTimeout(_releaseT); // a sheet that hands off to another keeps the same history entry
    // back gesture / Android back closes the sheet instead of leaving the app
    if (!_ovMarker) { try { history.pushState({ ihOverlay: 1 }, ''); _ovMarker = true; } catch (e) { _ovMarker = false; } }
  }
  root.innerHTML = html;
  const ov = root.firstElementChild;
  if (!ov) return;
  const focusTarget = ov.querySelector('.sheet') || ov;
  focusTarget.setAttribute('tabindex', '-1');
  if (ov.classList.contains('overlay')) { ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); }
  focusTarget.focus({ preventScroll: true });
}
function closeOverlay() {
  $('overlay-root').innerHTML = '';
  if (_restoreFocus && _restoreFocus.isConnected) { try { _restoreFocus.focus(); } catch (e) { /* gone */ } }
  _restoreFocus = null;
  const cb = _onClose; _onClose = null;
  // release the history entry on the next tick, so picker -> log sheet -> timer hand-offs
  // reuse it instead of stacking (and racing) one entry per sheet
  if (_ovMarker && !_popping) {
    clearTimeout(_releaseT);
    _releaseT = setTimeout(() => {
      if (_ovMarker && !$('overlay-root').firstElementChild) { _ovMarker = false; try { history.back(); } catch (e) { /* no history */ } }
    }, 0);
  }
  if (cb) cb();
}
window.addEventListener('popstate', () => {
  _ovMarker = false; // whatever we pushed is behind us now
  if (!$('overlay-root').firstElementChild) return;
  _popping = true;
  if (T) cancelTimer(); else closeOverlay();
  _popping = false;
});
// keep focus inside an open sheet — a modal you can tab out of is not modal
document.addEventListener('focusin', (e) => {
  const ov = $('overlay-root').firstElementChild;
  if (!ov || ov.contains(e.target)) return;
  const el = ov.querySelector('.sheet') || ov;
  el.focus({ preventScroll: true });
});
document.addEventListener('keydown', (e) => {
  const ov = $('overlay-root').firstElementChild;
  // Escape dismisses a sheet — but never a running timer, which would drop the practice
  if (e.key === 'Escape' && ov && ov.classList.contains('overlay')) { e.preventDefault(); closeOverlay(); return; }
  // card-style controls are divs; make them behave like the buttons they claim to be
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.tagName !== 'BUTTON' && t.getAttribute && t.getAttribute('role') === 'button') {
    e.preventDefault(); t.click(); return;
  }
  if (e.key === '/' && !ov && !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) {
    e.preventDefault(); switchTab('library'); $('search').focus(); $('search').select();
  }
});

function choiceDialog(opts) {
  // themed replacement for native confirm/alert — returns the chosen button's value
  return new Promise((resolve) => {
    const btns = opts.buttons || [{ label: 'OK', value: true, kind: 'primary' }];
    showOverlay(`
      <div class="overlay center" id="dlg-ov">
        <div class="sheet">
          <div class="sheet-head"><div class="t">${esc(opts.title || '')}</div></div>
          <div class="sheet-body">
            ${opts.msg ? `<div class="dialog-msg">${esc(opts.msg)}</div>` : ''}
            <div class="btn-row">${btns.map((b, i) => `<button class="btn ${b.kind || ''}" data-i="${i}" style="flex:1">${esc(b.label)}</button>`).join('')}</div>
          </div>
        </div>
      </div>`);
    _onClose = () => resolve(undefined); // Escape / back / backdrop all count as "no choice"
    document.querySelectorAll('#dlg-ov [data-i]').forEach((el) => {
      el.addEventListener('click', () => { _onClose = null; closeOverlay(); resolve(btns[+el.dataset.i].value); });
    });
    $('dlg-ov').addEventListener('click', (e) => { if (e.target.id === 'dlg-ov') closeOverlay(); });
  });
}

/* ---------- day totals, streaks ---------- */
function allSessions() { return active && active.entries.length ? state.sessions.concat([active]) : state.sessions; }
function sortSessions() {
  state.sessions.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.startedAt || 0) - (b.startedAt || 0)));
}
function sessionMin(s) { return s.entries.reduce((t, e) => t + e.min, 0); }
function dayTotals() {
  const m = {};
  allSessions().forEach((s) => { if (s.entries.length) m[s.date] = (m[s.date] || 0) + sessionMin(s); });
  return m;
}
function streaks() {
  const days = dayTotals();
  const d = new Date();
  let cur = 0;
  if (!days[todayStr(d)]) d.setDate(d.getDate() - 1);
  while (days[todayStr(d)]) { cur++; d.setDate(d.getDate() - 1); }
  const dates = Object.keys(days).sort();
  let best = 0, run = 0, prev = null;
  dates.forEach((ds) => {
    if (prev) {
      const p = new Date(prev + 'T12:00:00'); p.setDate(p.getDate() + 1);
      run = todayStr(p) === ds ? run + 1 : 1;
    } else run = 1;
    if (run > best) best = run;
    prev = ds;
  });
  return { current: cur, best: best };
}
function renderStreakChip() {
  const s = streaks();
  const el = $('streak-chip');
  el.textContent = '🔥 ' + s.current + ' day' + (s.current === 1 ? '' : 's');
  el.className = s.current ? '' : 'zero';
  updateBadge();
}

function exerciseMatchesSearch(ex, q) {
  if (!q) return true;
  if (ex.title.toLowerCase().includes(q)) return true;
  if (ex.sanskrit && ex.sanskrit.toLowerCase().includes(q)) return true;
  if (ex.keywords && ex.keywords.toLowerCase().includes(q)) return true;
  if (ex.tag.toLowerCase().includes(q)) return true;
  if (ex.quickCue && ex.quickCue.toLowerCase().includes(q)) return true;
  if (ex.variations) {
    for (const v of ex.variations) {
      if (v.title.toLowerCase().includes(q)) return true;
      if (v.sanskrit && v.sanskrit.toLowerCase().includes(q)) return true;

function startSession() {

function logEntry(exId, varId, min, opts) {
  if (!active) { startSession(); toast('Session started'); }
  active.entries.push({ id: uid(), exId: exId, varId: varId || null, min: Math.max(1, Math.round(min)) });

let T = null; // {queue:[{exId,varId,min}], idx, endTs, remainMs, paused, planId, planName, logged:[], lastBellMin}

}

}

}
function stepsFor(step) {

}
function beginStep() {
  const step = T.queue[T.idx];

  T.durMs = step.min * 60000;
  T.endTs = Date.now() + T.durMs;

  T.lastBellMin = 0;

  bell(1);

/* A few quiet seconds before the opening bell, so the sit doesn't start while the phone is

function runPrep() {
  T.prepping = true;

  T.cueIdx = -1;
  drawTimer();
  grabWakeLock();
  const end = Date.now() + state.sound.prepSec * 1000;
  const tick = () => {
    const left = Math.ceil((end - Date.now()) / 1000);
    if (left <= 0) return endPrep();
    const count = $('t-count'), cue = $('t-cue');
    if (count) count.textContent = String(left);
    if (cue) { cue.style.display = ''; cue.innerHTML = '<span class="n">Settling in</span>Find your seat — the bell begins the sit.'; }
  };

}
function endPrep() {

  T.endTs = Date.now() + T.durMs;

  runTimer();
}
// draw + tick + keep the screen on + persist; shared by a fresh step and a resumed one
function runTimer() {

function timerTick() {

    if (c) c.textContent = fmtClock(el / 1000);
    document.title = fmtClock(el / 1000) + ' · ' + APP_TITLE;
    const ivo = state.sound.intervalMin;
    if (ivo > 0) { const em = Math.floor(el / 60000); if (em > T.lastBellMin && em % ivo === 0) { T.lastBellMin = em; bell(1); } }
    return;

  if (el) el.textContent = fmtClock(left / 1000);
  document.title = fmtClock(left / 1000) + ' · ' + APP_TITLE; // the tab reads as a clock on desktop

  if (iv > 0) {
    const elapsedMin = Math.floor((T.durMs - left) / 60000);

/* A phone can discard a backgrounded tab mid-practice. Persist the running timer so a

const TIMER_KEY = 'ih_timer_v1';
function saveTimer() {

    queue: T.queue, idx: T.idx, planId: T.planId, planName: T.planName, logged: T.logged,
    endTs: T.endTs, durMs: T.durMs, paused: T.paused, remainMs: T.remainMs, stepStart: T.stepStart, elapsedMs: T.elapsedMs, savedAt: Date.now(),
  }));

async function resumeTimer() {

  localStorage.removeItem(TIMER_KEY);
  if (!s || !Array.isArray(s.queue) || !s.queue.length || !s.queue[s.idx]) return;
  const step = s.queue[s.idx];
  const open = !step.min;
  const elapsed = open ? (s.paused ? (s.elapsedMs || 0) : Date.now() - (s.stepStart || s.savedAt)) : 0;
  const left = Math.max(0, s.paused ? (s.remainMs || 0) : s.endTs - Date.now());
  const pick = await choiceDialog({
    title: '⏱ Timer interrupted',
    msg: displayName(step.exId, step.varId) + (open ? ' — open sit, ' + fmtClock(elapsed / 1000) + ' so far.' : left > 1000
      ? ' — ' + fmtClock(left / 1000) + ' still to run.'
      : ' — its time ran out while the app was closed.'),
    buttons: [
      { label: open || left > 1000 ? 'Resume' : 'Finish it', value: 'go', kind: 'primary' },

    queue: s.queue, idx: s.idx, planId: s.planId, planName: s.planName, logged: s.logged || [],
    paused: false, durMs: s.durMs, endTs: Date.now() + left, lastBellMin: 0, open: open, prepped: true,

function finishTimer() {

  s.notes = String(text == null ? '' : text).slice(0, 2000);
  s.updatedAt = Date.now();
  saveState();
}
function repeatSession(sid) {
  const s = state.sessions.find((x) => x.id === sid);
  if (!s || !s.entries.length) return;
  startPlanQueue(s.entries.map((e) => ({ exId: e.exId, varId: e.varId, min: e.min })), null, 'Repeat of ' + dateLabel(s.date));
}
/* deletions are undoable rather than confirmed: one tap to fix a mistake beats a
   dialog on every correct delete. Clear-all keeps its double confirmation. */
function delSession(sid) {
  const i = state.sessions.findIndex((s) => s.id === sid);
  if (i < 0) return;
  const gone = state.sessions.splice(i, 1)[0];
  saveState();
  renderAll();
  toast('Deleted ' + dateLabel(gone.date) + ' session', () => {
    state.sessions.splice(i, 0, gone);
    saveState();
    renderAll();
  });
}
function delHistEntry(sid, eid) {
  const s = state.sessions.find((x) => x.id === sid);
  if (!s) return;
  const i = s.entries.findIndex((e) => e.id === eid);
  if (i < 0) return;
  const gone = s.entries.splice(i, 1)[0];
  s.updatedAt = Date.now();
  const alsoDropped = !s.entries.length;
  if (alsoDropped) state.sessions = state.sessions.filter((x) => x.id !== sid);
  saveState();
  renderAll();
  toast('Removed ' + displayName(gone.exId, gone.varId), () => {
    s.entries.splice(i, 0, gone);
    if (alsoDropped) { state.sessions.push(s); sortSessions(); }
    saveState();
    renderAll();
  });
}
